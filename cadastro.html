<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cadastro - Instituto Recomeçar</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- MENU -->
    <header>
        <div class="logo">
            INSTITUTO <span>RECOMEÇAR</span>
        </div>

        <nav>
            <a href="index.html">Início</a>
            <a href="cursos.html">Cursos</a>
            <a href="vagas.html">Vagas</a>
            <a href="talentos.html">Talentos</a>
        </nav>

        <a href="login.html" class="botao-menu">Entrar</a>
    </header>


    <!-- CADASTRO -->
    <main class="pagina-login">

        <section class="caixa-login">

            <p class="subtitulo">COMECE SUA JORNADA</p>

            <h1>Crie sua conta</h1>

            <p class="texto-login">
                Faça parte do Instituto Recomeçar e comece sua jornada
                de capacitação e desenvolvimento profissional.
            </p>

            <form id="formulario-cadastro">

                <label for="nome">Nome completo</label>

                <input
                    type="text"
                    id="nome"
                    placeholder="Digite seu nome completo"
                >


                <label for="email-cadastro">E-mail</label>

                <input
                    type="email"
                    id="email-cadastro"
                    placeholder="Digite seu e-mail"
                >


                <label for="senha-cadastro">Crie uma senha</label>

                <input
                    type="password"
                    id="senha-cadastro"
                    placeholder="Crie uma senha"
                >


                <button type="submit" class="botao-login">
                    Criar minha conta
                </button>

            </form>


            <p class="cadastro-texto">
                Já possui uma conta?
                <a href="login.html">Entrar</a>
            </p>

        </section>

    </main>


    <footer>
        <p class="copyright">
            © 2026 Instituto Recomeçar — Protótipo educacional
        </p>
    </footer>


    <script src="script.js"></script>

</body>
</html>
