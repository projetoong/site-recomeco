<!DOCTYPE html>

<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Entrar - Instituto Recomeçar</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- MENU -->
    <header>
        <div class="logo">
            INSTITUTO <span>RECOMEÇAR</span>
        </div>

        <nav>
            <a href="index.html">Início</a>
            <a href="cursos.html">Cursos</a>
            <a href="vagas.html">Vagas</a>
            <a href="talentos.html">Talentos</a>
        </nav>

        <a href="login.html" class="botao-menu">Entrar</a>
    </header>


    <!-- LOGIN -->
    <main class="pagina-login">

        <section class="caixa-login">

            <p class="subtitulo">BEM-VINDO DE VOLTA</p>

            <h1>Acesse sua conta</h1>

            <p class="texto-login">
                Continue sua jornada de desenvolvimento e encontre
                novas oportunidades.
            </p>

            <form>

                <label for="email">E-mail</label>

                <input
                    type="email"
                    id="email"
                    placeholder="Digite seu e-mail"
                    required
                >

                <label for="senha">Senha</label>

                <input
                    type="password"
                    id="senha"
                    placeholder="Digite sua senha"
                    required
                >

                <button type="submit" class="botao-login">
                    Entrar na plataforma
                </button>

            </form>

            <p class="cadastro-texto">
                Ainda não possui uma conta?
                <a href="cadastro.html">Cadastre-se</a>
            </p>

        </section>

    </main>


    <footer>
        <p class="copyright">
            © 2026 Instituto Recomeçar — Protótipo educacional
        </p>
    </footer>


    <script src="script.js"></script>

</body>

</html>
